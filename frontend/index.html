<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Humanizer</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .controls { display: flex; gap: .75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  textarea { width: 100%; height: 55vh; font-family: ui-monospace, monospace;
             font-size: .9rem; padding: .75rem; box-sizing: border-box; resize: vertical; }
  button { padding: .5rem 1rem; font-size: .95rem; cursor: pointer; }
  .metrics { display: flex; gap: 2rem; font-size: .85rem; margin-top: .75rem;
             font-family: ui-monospace, monospace; }
  .warn { color: #b45309; font-size: .85rem; margin-top: .5rem; white-space: pre-wrap; }
  button:disabled { opacity: .5; cursor: progress; }
</style>
</head>
<body>
  <h1>AI Humanizer — essay mode</h1>

  <div class="controls">
    <label>Tone
      <select id="tone">
        <option value="academic" selected>academic</option>
        <option value="professional">professional</option>
        <option value="casual">casual</option>
      </select>
    </label>
    <label>Provider
      <select id="provider">
        <option value="">default</option>
        <option value="groq">groq</option>
        <option value="gemini">gemini</option>
        <option value="ollama">ollama (local)</option>
      </select>
    </label>
    <label><input type="checkbox" id="verify" checked /> verify</label>
    <button id="go">Humanize →</button>
  </div>

  <div class="grid">
    <textarea id="input" placeholder="Paste your essay here…"></textarea>
    <textarea id="output" readonly placeholder="Humanized output will appear here…"></textarea>
  </div>

  <div class="metrics" id="metrics"></div>
  <div class="warn" id="warnings"></div>

<script>
const $ = (id) => document.getElementById(id);

$("go").addEventListener("click", async () => {
  const btn = $("go");
  btn.disabled = true;
  btn.textContent = "Working…";
  $("metrics").textContent = "";
  $("warnings").textContent = "";
  try {
    const res = await fetch("/humanize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: $("input").value,
        tone: $("tone").value,
        provider: $("provider").value || null,
        verify: $("verify").checked,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "request failed");

    $("output").value = data.humanized;
    const m = data.metrics;
    $("metrics").innerHTML =
      `<span>burstiness: ${m.original.burstiness} → ${m.humanized.burstiness}</span>` +
      `<span>ai-isms/100w: ${m.original.ai_ism_density} → ${m.humanized.ai_ism_density}</span>` +
      `<span>words: ${m.original.word_count} → ${m.humanized.word_count}</span>` +
      `<span>provider: ${data.provider}</span>`;
    if (data.warnings.length) {
      $("warnings").textContent = "⚠ " + data.warnings.join("\n⚠ ");
    }
  } catch (e) {
    $("warnings").textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Humanize →";
  }
});
</script>
</body>
</html>
